# 매일 아침 7시(한국) 자동 수집 + AI 분석 → 결과(data/)를 저장소에 커밋 → Vercel 이 자동으로 화면을 다시 배포
# 수동 실행: GitHub 저장소 → Actions → "매일 수집·분석" → Run workflow
name: 매일 수집·분석
on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = KST 07:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul   # 스냅샷 날짜·todayKey 가 한국 날짜로 찍히게 (UTC 러너에서 07:00 KST 실행이 '어제'로 찍히던 문제)
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}   # 스텝의 if 에서는 secrets 를 직접 못 쓴다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 수집 (레퍼런스 + 경쟁사 스냅샷 + 내 릴스)
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
        run: node collect.js
      - name: AI 분석 (Gemini 키가 있을 때만)
        if: ${{ env.HAS_GEMINI == 'true' }}
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node analyze.js || echo "분석 일부 실패 — 다음 실행 때 재시도"
      - name: 결과 커밋
        run: |
          # 커밋 작성자를 저장소 주인으로 — Vercel 은 프로젝트 권한이 없는 작성자(봇)의 커밋은 배포를 막는다
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "자동: 수집·분석 $(TZ=Asia/Seoul date +%Y-%m-%d)" && (git pull --rebase origin main || true) && git push; fi   # 화면에서 설정을 바꾼 커밋이 실행 중에 들어와도 push 가 막히지 않게
